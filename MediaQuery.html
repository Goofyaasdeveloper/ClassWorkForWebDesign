<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Media Query</title>
    <link rel="stylesheet" href="style.css">
    <style>
.img-container img {
    width: 500px;
    height: auto;
    border-radius: 10px;
    transition: all 1000ms;
}

@media (max-width: 600px) {
    .img-container img {
        
        width: 100%;  
        border-radius: 5px;
    }
}

@media (min-width: 600px) and (max-width: 900px) {
    .img-container img {
        width: 80%;
    }
}
</style>
</head>
<body>

    <h2></h2>

    <div class="img-container">
        <img src="https://i.pinimg.com/originals/18/4b/a2/184ba274530f9bb7b7cbccfaa5348523.jpg" alt="Sample Image">
    </div>


    

</body>
</html>
